name: Document renders wrong
description: Something in a .pages file looks different from Pages
labels: [rendering]
body:
  - type: markdown
    attributes:
      value: |
        **Please don't attach documents with personal content.** Recreate the problem in a new
        document with placeholder text, or describe it with screenshots.
  - type: textarea
    id: expected
    attributes:
      label: What Pages shows
      description: A screenshot or description of the document in Pages.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What `pages` prints
      description: Paste the output of `pages --color never yourfile.pages`, trimmed to the relevant part.
      render: text
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `pages --version`, and the Pages version that saved the file.
    validations:
      required: true
