[package]
name = "pages-cli"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "Render Apple Pages documents in the terminal"
license = "MIT"
repository = "https://github.com/crsves/pages"
homepage = "https://github.com/crsves/pages"
readme = "README.md"
keywords = ["pages", "iwork", "apple", "terminal", "cli"]
categories = ["command-line-utilities", "parser-implementations"]
exclude = ["/.github", "/packaging", "/assets", "/demo", "/rustfmt.toml", "tests/fixtures/*.py"]

[lib]
name = "pages_cli"
path = "src/lib.rs"

[[bin]]
name = "pages"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
snap = "1"
terminal_size = "0.4"
unicode-width = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

# `cargo binstall pages-cli` downloads the release tarball instead of compiling.
# Linux gnu hosts fall back to the static musl builds automatically.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/pages-v{ version }-{ target }.tar.gz"
bin-dir = "pages-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

# .deb packages built by the release workflow (cargo-deb). The release job
# generates target/assets/* with `pages --generate-man/--generate-completions`.
[package.metadata.deb]
name = "pages"
section = "utils"
priority = "optional"
maintainer = "devin <git@devin.tw>"
license-file = ["LICENSE", "0"]
copyright = "2026 devin"
extended-description = """\
Renders Apple Pages (.pages) documents as styled text in the terminal: \
headings, inline styles, lists, tables, links, and quotes. Reads the file \
directly, so Pages.app is not needed."""
assets = [
    ["target/release/pages", "usr/bin/", "755"],
    ["target/assets/pages.1.gz", "usr/share/man/man1/", "644"],
    ["target/assets/pages.bash", "usr/share/bash-completion/completions/pages", "644"],
    ["target/assets/_pages", "usr/share/zsh/vendor-completions/_pages", "644"],
    ["target/assets/pages.fish", "usr/share/fish/vendor_completions.d/pages.fish", "644"],
    ["README.md", "usr/share/doc/pages/README.md", "644"],
]

[profile.release]
lto = true
strip = true
codegen-units = 1
